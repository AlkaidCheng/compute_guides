site_name: Compute Guides
site_description: >-
  Quick-reference guides for everyday computing: the Unix command line,
  Bash, Git, and more.
site_author: Alkaid Cheng
site_url: https://alkaidcheng.github.io/compute_guides/
repo_url: https://github.com/AlkaidCheng/compute_guides
repo_name: AlkaidCheng/compute_guides
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/theme.css
  - stylesheets/code-tabs.css

extra_javascript:
  - javascripts/tabs.js

extra:
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      title: On this page
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# The home page is reached from the header; it stays out of the sidebar.
not_in_nav: |
  /index.md

# Turn nav and link problems into warnings so `mkdocs build --strict` fails on them.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Unix:
      - unix/index.md
      - unix/find.md
      - unix/links.md
      - unix/permissions.md
      - unix/archives.md
      - unix/ssh.md
  - Bash:
      - bash/index.md
  - Git:
      - git/index.md
